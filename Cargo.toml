[package]
name = "twin_plate_vdm"
version = "0.1.0"
edition = "2021"
description = "Twin-plate vector displacement maps. Two images encode a solid. PNG or OpenEXR."
license = "MIT"

[lib]
crate-type = ["cdylib", "rlib"]

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[dependencies]
miniz_oxide = { version = "0.8", default-features = false }
